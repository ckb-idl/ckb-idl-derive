[package]
name = "ckb-idl-export"
version = "0.1.0"
edition = "2024"
description = "Host-side canonical IDL exporter for CKB witness schemas"
license = "MIT"
repository = "https://github.com/ckb-idl/ckb-idl-derive"
readme = "README.md"

[dependencies]
ckb-idl-types = { version = "0.1.0", path = "../ckb-idl-types" }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"

[dev-dependencies]
ckb-idl-derive = { version = "0.1.0", path = ".." }
ckb-idl-types = { version = "0.1.0", path = "../ckb-idl-types", features = ["ckb-contract"] }
ckb-std = "1.1"
tempfile = "3"
