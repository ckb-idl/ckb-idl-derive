[workspace]
members = [".", "ckb-idl-types", "ckb-idl-export"]

[package]
name = "ckb-idl-derive"
version = "0.1.0"
edition = "2024"
description = "Rust derives for CKB IDL witness schemas and decoding"
license = "MIT"
repository = "https://github.com/ckb-idl/ckb-idl-derive"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "derive"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
ckb-std = "1.1"

[dev-dependencies]
proptest = "1"
trybuild = "1"
tempfile = "3"
ckb-std = "1.1"
ckb-idl-types = { path = "ckb-idl-types", features = ["ckb-contract"] }
